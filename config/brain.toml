[server]
host = "0.0.0.0"
port = 8090

[upstream]
base_url = "http://127.0.0.1:8080/v1"
generate_slot = 0
classify_slot = 1
classify_timeout_s = 1.5

[gate]
follow_up_window_s = 8
max_follow_ups = 3

[paths]
persona = "config/persona.yaml"
sessions_dir = "data/sessions"
lexicon = "config/lexicon.tsv"
players = "config/players.txt"

[knowledge]
db_path = "data/familiar.db"
notes_dir = "data/notes"
chunks_per_corpus = 3
max_context_chars = 4800
retention_days = 7

[robot]
daemon_url = "http://10.0.0.100:8000"
doa_timeout_s = 0.15

[motion]
min_gesture_gap_s = 6
reaction_gap_s = 15
glance_gap_s = 30
tracking_linger_s = 4
mode_timeout_s = 300
